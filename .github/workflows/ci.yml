name: CI

on:
  push:
    branches:
    - master
    tags:
    - v*.*.*
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add rustfmt

      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add clippy

      - run: RUSTFLAGS="-D warnings" cargo clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal

      - run: cargo test

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal

      - run: cargo build --release --target=x86_64-unknown-linux-gnu
      - run: strip target/x86_64-unknown-linux-gnu/release/boundary-to-kml
      - run: ls -lh target/x86_64-unknown-linux-gnu/release/boundary-to-kml

      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: target/x86_64-unknown-linux-gnu/release/boundary-to-kml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
